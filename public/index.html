<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f0f2f5; height: 100vh; }
  .hidden { display: none !important; }

  #login { display: flex; height: 100%; align-items: center; justify-content: center; }
  #login form { background: #fff; padding: 24px; border-radius: 12px; width: 300px; box-shadow: 0 2px 10px #0002; }
  #login input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
  #err { color: #c00; font-size: 14px; min-height: 18px; }

  #app { display: flex; height: 100%; }
  #sidebar { width: 200px; background: #fff; border-right: 1px solid #ddd; padding: 12px; overflow-y: auto; }
  #sidebar h3 { margin: 0 0 8px; font-size: 14px; color: #666; }
  #users div::before { content: "● "; color: #2ecc71; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; background: #fff; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #0b84ff; color: #fff; }
  .msg .meta { font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .sys { align-self: center; font-size: 12px; color: #888; }
  #typing { height: 20px; padding: 0 14px; font-size: 12px; color: #888; }
  #composer { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
  #composer input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; }
  button { padding: 10px 16px; border: 0; border-radius: 20px; background: #0b84ff; color: #fff; cursor: pointer; }

  @media (max-width: 600px) { #sidebar { display: none; } }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h2 style="margin:0">Join chat</h2>
    <input id="nameInput" placeholder="Choose a username" maxlength="20" autofocus />
    <div id="err"></div>
    <button style="width:100%">Join</button>
  </form>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <h3>ONLINE</h3>
    <div id="users"></div>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="composer">
      <input id="msgInput" placeholder="Type a message…" autocomplete="off" />
      <button>Send</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let me = "";
  const typingUsers = new Set();

  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");

  // ---- Join ----
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("nameInput").value.trim();
    socket.emit("join", name, (res) => {
      if (!res.ok) return ($("err").textContent = res.error);
      me = name;
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      res.history.forEach(addMessage);
      $("msgInput").focus();
    });
  });

  // ---- Render ----
  function addMessage(m) {
    const div = document.createElement("div");
    div.className = "msg" + (m.user === me ? " me" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${m.user} · ${new Date(m.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    const body = document.createElement("div");
    body.textContent = m.text;
    div.append(meta, body);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystem(text) {
    const div = document.createElement("div");
    div.className = "sys";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ---- Send ----
  let typingTimer;
  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("msgInput");
    if (!input.value.trim()) return;
    socket.emit("message", input.value);
    socket.emit("typing", false);
    input.value = "";
  });

  $("msgInput").addEventListener("input", () => {
    socket.emit("typing", true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit("typing", false), 1500);
  });

  // ---- Events ----
  socket.on("message", addMessage);
  socket.on("system", addSystem);
  socket.on("users", (list) => {
    $("users").replaceChildren(
      ...list.map((u) => Object.assign(document.createElement("div"), { textContent: u }))
    );
  });
  socket.on("typing", ({ user, isTyping }) => {
    isTyping ? typingUsers.add(user) : typingUsers.delete(user);
    const names = [...typingUsers];
    $("typing").textContent = names.length ? `${names.join(", ")} typing…` : "";
  });
</script>
</body>
</html>
